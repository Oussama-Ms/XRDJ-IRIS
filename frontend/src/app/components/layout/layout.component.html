<div class="layout-container">
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/barid-bank-logo.png" alt="Barid Bank" class="sidebar-logo" />
      <h2>XRDJ-IRIS</h2>
    </div>

    <nav class="nav-menu">
      <a routerLink="/app/visualize" routerLinkActive="active" class="nav-item">
        <span>{{ 'LAYOUT.DASHBOARD' | translate }}</span>
      </a>

      <a routerLink="/app/stock-rejets" routerLinkActive="active" class="nav-item">
        <span>{{ 'LAYOUT.STOCK_REJETS' | translate }}</span>
      </a>

      <!-- Admin only nav item -->
      <a *ngIf="authService.getRole() === 'ROLE_ADMIN'" routerLink="/app/import" routerLinkActive="active"
        class="nav-item">
        <span>{{ 'LAYOUT.IMPORT_DATA' | translate }}</span>
      </a>
    </nav>

    <div class="user-profile">
      <div class="user-info" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span class="role">{{ authService.getRole()?.replace('ROLE_', '') }}</span>
        
        <div class="notification-container">
          <button class="notification-bell sidebar-bell" (click)="toggleNotifications()">
            <i class="fa-solid fa-bell"></i>
            <span class="badge" *ngIf="alerts.length > 0">{{ alerts.length }}</span>
          </button>
          
          <div class="notification-dropdown sidebar-dropdown" *ngIf="showNotifications" style="background-color: white; color: black; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div class="dropdown-header" style="background-color: #f3f4f6; padding: 12px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between;">
              <h4 style="margin: 0; color: black; font-weight: bold;">{{ 'NOTIFICATIONS' | translate }}</h4>
              <button class="clear-btn" (click)="alerts = []; showNotifications = false" style="color: blue;">Clear All</button>
            </div>
            <div class="dropdown-body" style="max-height: 300px; overflow-y: auto; padding: 10px;">
              <div class="notification-item" *ngFor="let alert of alerts" style="color: black; padding: 10px; border-bottom: 1px solid #eee; display: flex; gap: 10px;">
                <i class="fa-solid fa-circle-info" style="color: blue;"></i>
                <span style="color: black;">{{ alert }}</span>
              </div>
              <div class="empty-state" *ngIf="alerts.length === 0" style="color: black; padding: 20px; text-align: center;">
                No new notifications
              </div>
            </div>
          </div>
        </div>

      </div>
      <button class="logout-btn" (click)="logout()">
        {{ 'LAYOUT.LOGOUT' | translate }}
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
  <app-chat-widget></app-chat-widget>
</div>
