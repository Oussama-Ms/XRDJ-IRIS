version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xrdj_postgres
    environment:
      POSTGRES_DB: xrdj_iris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
